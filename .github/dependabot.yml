# Weekly update pull requests for the npm packages and the pinned actions, each release only after 14 days
# (CONTRIBUTING.md, "Dependencies").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # One pull request for all minor and patch updates of the tools; majors and runtime dependencies stay separate.
    # Vitest comes on its own, so a mutation run (Actions tab) can check it before it is merged.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - vitest

  - package-ecosystem: github-actions
    # The workflows and the shared setup action both pin actions.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - '*'
